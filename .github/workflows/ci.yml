name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        run: pip install -r requirements.txt
      # The suite isolates itself to a temp DB via tests/__init__ bootstrap and
      # fails fast if it ever resolves to data/pat.db. No Ollama is required.
      - name: Run backend test suite
        run: python -m unittest discover -s tests -t .

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: TypeScript (tsc -b)
        working-directory: frontend
        run: npx tsc -b
      - name: Lint (oxlint)
        working-directory: frontend
        run: npx oxlint
      - name: Unit tests (Vitest)
        working-directory: frontend
        run: npx vitest run

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    env:
      # Playwright config uses PAT_PYTHON to launch the backend; on CI use the
      # python used to install backend deps (avoids the hardcoded local path).
      PAT_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend deps
        run: pip install -r requirements.txt
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # E2E launches its own isolated backend + DB (PAT_DB_PATH set by config);
      # it never touches data/pat.db. No Ollama required for current specs.
      - name: Run Playwright E2E
        working-directory: frontend
        run: npx playwright test
